<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>이벤트 랭킹 보드</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            gap: 20px;
        }

        /* ── 이벤트 설정 패널 ── */
        .event-panel {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
            width: 260px;
            height: 88vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            flex-shrink: 0;
        }

        .event-header {
            padding: 20px 24px 16px;
            border-bottom: 1px solid #eee;
            flex-shrink: 0;
        }

        .event-header h1 {
            font-size: 18px;
            font-weight: 700;
            color: #111;
        }

        .event-body {
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .event-field label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #888;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .event-field input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 13px;
            outline: none;
        }

        .event-field input:focus { border-color: #555; }

        .event-submit {
            padding: 9px 0;
            background: #333;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            margin-top: 4px;
        }

        .event-submit:hover { background: #555; }

        .event-msg {
            font-size: 12px;
            color: #888;
            min-height: 16px;
        }

        .event-msg.error { color: #e05; }
        .event-msg.success { color: #297a3a; }

        .event-status {
            margin-top: 4px;
            padding: 12px;
            background: #f8f8f8;
            border-radius: 8px;
            font-size: 12px;
            color: #555;
            line-height: 1.8;
        }

        .event-status .status-dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            margin-right: 5px;
            vertical-align: middle;
        }

        .event-status .dot-active { background: #297a3a; }
        .event-status .dot-inactive { background: #ccc; }

        /* ── 구매/환불 패널 ── */
        .action-panel {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
            width: 320px;
            height: 88vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            flex-shrink: 0;
        }

        .action-header {
            padding: 20px 24px 16px;
            border-bottom: 1px solid #eee;
            flex-shrink: 0;
        }

        .action-header h1 {
            font-size: 18px;
            font-weight: 700;
            color: #111;
        }

        .action-section {
            padding: 16px 24px;
            border-bottom: 1px solid #eee;
            flex-shrink: 0;
        }

        .action-section h2 {
            font-size: 13px;
            font-weight: 600;
            color: #888;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .action-form {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .action-form input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .action-form input:focus { border-color: #555; }

        .action-form button {
            padding: 8px 0;
            background: #333;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }

        .action-form button:hover { background: #555; }

        .action-msg {
            margin-top: 6px;
            font-size: 12px;
            color: #888;
            min-height: 16px;
        }

        .action-msg.error { color: #e05; }
        .action-msg.success { color: #297a3a; }

        .history-section {
            display: flex;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
        }

        .history-section h2 {
            font-size: 13px;
            font-weight: 600;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            padding: 14px 24px 8px;
            flex-shrink: 0;
        }

        .history-list {
            overflow-y: auto;
            flex: 1;
        }

        .history-list::-webkit-scrollbar { width: 4px; }
        .history-list::-webkit-scrollbar-thumb { background: #ddd; border-radius: 2px; }

        .history-item {
            display: flex;
            align-items: center;
            padding: 10px 24px;
            border-bottom: 1px solid #f5f5f5;
            gap: 10px;
            position: relative;
        }

        .history-item:last-child { border-bottom: none; }

        .history-item.refunded { opacity: 0.4; }

        .history-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .history-amount {
            font-size: 14px;
            font-weight: 600;
            color: #333;
        }

        .history-time {
            font-size: 11px;
            color: #aaa;
        }

        .refund-badge {
            font-size: 11px;
            color: #aaa;
            flex-shrink: 0;
        }

        .refund-btn {
            display: none;
            padding: 4px 10px;
            background: #e05;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .history-item:not(.refunded):hover .refund-btn { display: block; }
        .history-item:not(.refunded):hover .refund-badge { display: none; }

        /* ── 랭킹 보드 ── */
        .board {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
            width: 420px;
            height: 88vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            flex-shrink: 0;
        }

        .board-header {
            padding: 20px 24px 16px;
            border-bottom: 1px solid #eee;
            flex-shrink: 0;
        }

        .board-header h1 {
            font-size: 18px;
            font-weight: 700;
            color: #111;
        }

        .board-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 6px;
        }

        .board-meta span, #refresh-timer {
            font-size: 12px;
            color: #888;
        }

        .refresh-btn {
            padding: 3px 10px;
            background: none;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 12px;
            color: #555;
            cursor: pointer;
        }

        .refresh-btn:hover {
            background: #f5f5f5;
        }

        .entry-list {
            overflow-y: auto;
            flex: 1;
        }

        .entry-list::-webkit-scrollbar { width: 4px; }
        .entry-list::-webkit-scrollbar-thumb { background: #ddd; border-radius: 2px; }

        .entry {
            display: flex;
            align-items: center;
            padding: 12px 24px;
            border-bottom: 1px solid #f5f5f5;
            gap: 14px;
        }

        .entry:last-child { border-bottom: none; }

        .rank {
            width: 28px;
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            color: #555;
            flex-shrink: 0;
        }

        .rank.top1 { color: #f5a623; font-size: 16px; }
        .rank.top2 { color: #9b9b9b; font-size: 15px; }
        .rank.top3 { color: #c47d2e; font-size: 15px; }

        .entry-user {
            flex: 1;
            font-size: 14px;
            color: #333;
        }

        .entry-score {
            font-size: 14px;
            font-weight: 600;
            color: #333;
        }

        .empty {
            text-align: center;
            color: #aaa;
            font-size: 14px;
            padding: 40px 0;
        }

        .my-rank-section {
            padding: 14px 24px;
            border-top: 1px solid #eee;
            flex-shrink: 0;
        }

        .my-rank-form {
            display: flex;
            gap: 8px;
        }

        .my-rank-form input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .my-rank-form input:focus { border-color: #555; }

        .my-rank-form button {
            padding: 8px 16px;
            background: #333;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }

        .my-rank-form button:hover { background: #555; }

        .my-rank-result {
            margin-top: 10px;
            font-size: 13px;
            color: #444;
            min-height: 18px;
        }

        .my-rank-result.error { color: #e05; }

        /* ── 이벤트 결과 패널 ── */
        .result-panel {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
            width: 480px;
            height: 88vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            flex-shrink: 0;
        }

        .result-header {
            padding: 20px 24px 16px;
            border-bottom: 1px solid #eee;
            flex-shrink: 0;
        }

        .result-header h1 {
            font-size: 18px;
            font-weight: 700;
            color: #111;
        }

        .result-form {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .result-form input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .result-form input:focus { border-color: #555; }

        .result-form button {
            padding: 8px 16px;
            background: #333;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }

        .result-form button:hover { background: #555; }

        .result-user-label {
            margin-top: 10px;
            font-size: 13px;
            color: #888;
            min-height: 18px;
        }

        .result-user-label.error { color: #e05; }

        .result-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .result-placeholder {
            color: #bbb;
            font-size: 14px;
        }

        .chart-wrap {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

<!-- 이벤트 설정 패널 -->
<div class="event-panel">
    <div class="event-header">
        <h1>이벤트 설정</h1>
    </div>
    <div class="event-body">
        <div class="event-field">
            <label>시작 시각</label>
            <input type="datetime-local" id="event-start" step="1" />
        </div>
        <div class="event-field">
            <label>종료 시각</label>
            <input type="datetime-local" id="event-end" step="1" />
        </div>
        <button class="event-submit" onclick="configEvent()">이벤트 설정</button>
        <div class="event-msg" id="event-msg"></div>
        <div class="event-status" id="event-status"></div>
    </div>
</div>

<!-- 구매/환불 패널 -->
<div class="action-panel">
    <div class="action-header">
        <h1>구매 / 환불</h1>
    </div>

    <div class="action-section">
        <h2>구매</h2>
        <div class="action-form">
            <input type="number" id="purchase-user-id" placeholder="유저 ID" min="1" />
            <input type="number" id="purchase-amount" placeholder="금액 (원)" min="1" />
            <button onclick="submitPurchase()">구매</button>
        </div>
        <div class="action-msg" id="purchase-msg"></div>
    </div>

    <div class="history-section">
        <h2>구매 내역</h2>
        <div class="history-list" id="history-list">
            <div class="empty" style="padding: 20px 0;">유저 ID로 구매하면 내역이 표시됩니다.</div>
        </div>
    </div>
</div>

<!-- 랭킹 보드 -->
<div class="board">
    <div class="board-header">
        <h1>랭킹 보드 TOP 100</h1>
        <div class="board-meta">
            <span id="updated-at">-</span>
            <div style="display:flex; align-items:center; gap:8px;">
                <span id="refresh-timer">10초 후 갱신</span>
                <button class="refresh-btn" onclick="fetchAndRender(); resetTimer();">↻</button>
            </div>
        </div>
    </div>
    <div class="entry-list" id="entry-list">
        <div class="empty">불러오는 중...</div>
    </div>
    <div class="my-rank-section">
        <div class="my-rank-form">
            <input type="number" id="user-id-input" placeholder="유저 ID 입력" min="1" />
            <button onclick="fetchMyRank()">순위 조회</button>
        </div>
        <div class="my-rank-result" id="my-rank-result"></div>
    </div>
</div>

<!-- 이벤트 결과 패널 -->
<div class="result-panel">
    <div class="result-header">
        <h1>이벤트 구매 이력</h1>
        <div class="result-form">
            <input type="number" id="result-user-input" placeholder="유저 ID 입력" min="1" />
            <button onclick="fetchResult()">조회</button>
        </div>
        <div class="result-user-label" id="result-user-label"></div>
    </div>
    <div class="result-body" id="result-body">
        <span class="result-placeholder">유저 ID를 입력하면 구매액 변화를 확인할 수 있습니다.</span>
    </div>
</div>

<script>
    /* ── 공통 유틸 ── */
    const POLL_INTERVAL = 10000;
    let countdown = POLL_INTERVAL / 1000;
    let timerInterval = null;

    function rankLabel(rank) {
        if (rank === 1) return '🥇';
        if (rank === 2) return '🥈';
        if (rank === 3) return '🥉';
        return rank;
    }

    function rankClass(rank) {
        if (rank === 1) return 'rank top1';
        if (rank === 2) return 'rank top2';
        if (rank === 3) return 'rank top3';
        return 'rank';
    }

    function formatScore(score) {
        return Number(score).toLocaleString('ko-KR') + '원';
    }

    function formatTime(iso) {
        return new Date(iso).toLocaleTimeString('ko-KR', {
            hour: '2-digit', minute: '2-digit', second: '2-digit'
        });
    }

    /* ── 이벤트 설정 ── */
    function toLocalDateTimeString(date) {
        const pad = n => String(n).padStart(2, '0');
        return `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;
    }

    function renderEventStatus(start, end) {
        const now = new Date();
        const s = new Date(start);
        const e = new Date(end);
        const active = now >= s && now <= e;
        const dot = `<span class="status-dot ${active ? 'dot-active' : 'dot-inactive'}"></span>`;
        const fmt = d => d.toLocaleString('ko-KR', { month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit' });
        document.getElementById('event-status').innerHTML =
            `${dot}${active ? '진행 중' : '비활성'}<br>시작: ${fmt(s)}<br>종료: ${fmt(e)}`;
    }

    async function configEvent() {
        const startVal = document.getElementById('event-start').value;
        const endVal = document.getElementById('event-end').value;
        const msgEl = document.getElementById('event-msg');

        if (!startVal || !endVal) {
            msgEl.className = 'event-msg error';
            msgEl.textContent = '시작/종료 시각을 모두 입력해주세요.';
            return;
        }
        if (startVal >= endVal) {
            msgEl.className = 'event-msg error';
            msgEl.textContent = '종료 시각이 시작 시각보다 늦어야 합니다.';
            return;
        }

        try {
            const res = await fetch('/api/event', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ startAt: startVal, endAt: endVal })
            });
            if (!res.ok) throw new Error();

            msgEl.className = 'event-msg success';
            msgEl.textContent = '이벤트가 설정되었습니다.';
            renderEventStatus(startVal, endVal);
        } catch (e) {
            msgEl.className = 'event-msg error';
            msgEl.textContent = '설정에 실패했습니다.';
        }
    }

    // datetime-local 기본값: 현재 시각 ~ 1시간 후
    (function initEventInputs() {
        const now = new Date();
        const oneHourLater = new Date(now.getTime() + 60 * 60 * 1000);
        document.getElementById('event-start').value = toLocalDateTimeString(now);
        document.getElementById('event-end').value = toLocalDateTimeString(oneHourLater);
    })();

    /* ── 랭킹 보드 ── */
    async function fetchAndRender() {
        try {
            const res = await fetch('/api/leaderboard/top100');
            if (!res.ok) throw new Error();
            const data = await res.json();

            const list = document.getElementById('entry-list');
            if (!data || data.length === 0) {
                list.innerHTML = '<div class="empty">아직 참여자가 없습니다.</div>';
            } else {
                list.innerHTML = data.map((entry, i) => {
                    const rank = i + 1;
                    return `<div class="entry">
                        <span class="${rankClass(rank)}">${rankLabel(rank)}</span>
                        <span class="entry-user">유저 ${entry.userId}</span>
                        <span class="entry-score">${formatScore(entry.score)}</span>
                    </div>`;
                }).join('');
            }

            const now = new Date().toLocaleTimeString('ko-KR', {
                hour: '2-digit', minute: '2-digit', second: '2-digit'
            });
            document.getElementById('updated-at').textContent = `최근 갱신: ${now}`;
        } catch (e) {
            console.error('랭킹 조회 실패:', e);
        }
    }

    function resetTimer() {
        clearInterval(timerInterval);
        countdown = POLL_INTERVAL / 1000;
        timerInterval = setInterval(() => {
            countdown--;
            document.getElementById('refresh-timer').textContent = `${countdown}초 후 갱신`;
            if (countdown <= 0) {
                countdown = POLL_INTERVAL / 1000;
                fetchAndRender();
            }
        }, 1000);
    }

    async function fetchMyRank() {
        const userId = document.getElementById('user-id-input').value.trim();
        const resultEl = document.getElementById('my-rank-result');

        if (!userId) {
            resultEl.className = 'my-rank-result error';
            resultEl.textContent = '유저 ID를 입력해주세요.';
            return;
        }

        try {
            const res = await fetch(`/api/leaderboard/my-rank?userId=${userId}`);
            if (!res.ok) throw new Error();
            const data = await res.json();

            resultEl.className = 'my-rank-result';
            resultEl.textContent = data.rank === -1
                ? `유저 ${data.userId} — 아직 랭킹에 없습니다.`
                : `유저 ${data.userId} — 현재 ${data.rank}위`;

            fetchAndRender();
            resetTimer();
        } catch (e) {
            resultEl.className = 'my-rank-result error';
            resultEl.textContent = '조회에 실패했습니다.';
        }
    }

    document.getElementById('user-id-input').addEventListener('keydown', e => {
        if (e.key === 'Enter') fetchMyRank();
    });

    /* ── 구매/환불 ── */
    let currentPurchaseUserId = null;

    async function submitPurchase() {
        const userId = document.getElementById('purchase-user-id').value.trim();
        const amount = document.getElementById('purchase-amount').value.trim();
        const msgEl = document.getElementById('purchase-msg');

        if (!userId || !amount) {
            msgEl.className = 'action-msg error';
            msgEl.textContent = '유저 ID와 금액을 입력해주세요.';
            return;
        }

        try {
            const res = await fetch('/api/purchase', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId: Number(userId), amount: Number(amount) })
            });
            if (!res.ok) throw new Error();

            msgEl.className = 'action-msg success';
            msgEl.textContent = `${Number(amount).toLocaleString('ko-KR')}원 구매 완료`;
            document.getElementById('purchase-amount').value = '';

            currentPurchaseUserId = Number(userId);
            await fetchHistory();

            // 요구사항 1.1: 구매 시 랭킹 보드 즉시 갱신 + 타이머 리셋
            fetchAndRender();
            resetTimer();
        } catch (e) {
            msgEl.className = 'action-msg error';
            msgEl.textContent = '구매에 실패했습니다.';
        }
    }

    async function fetchHistory() {
        if (!currentPurchaseUserId) return;
        try {
            const res = await fetch(`/api/purchase?userId=${currentPurchaseUserId}`);
            if (!res.ok) throw new Error();
            const data = await res.json();
            renderHistory(data);
        } catch (e) {
            console.error('구매 내역 조회 실패:', e);
        }
    }

    function renderHistory(data) {
        const listEl = document.getElementById('history-list');
        if (!data || data.length === 0) {
            listEl.innerHTML = '<div class="empty" style="padding:20px 0;">구매 내역이 없습니다.</div>';
            return;
        }
        // 최신순 정렬
        const sorted = [...data].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
        listEl.innerHTML = sorted.map(item => `
            <div class="history-item ${item.refunded ? 'refunded' : ''}">
                <div class="history-info">
                    <span class="history-amount">${Number(item.amount).toLocaleString('ko-KR')}원</span>
                    <span class="history-time">유저 ${currentPurchaseUserId} · ${formatTime(item.createdAt)}</span>
                </div>
                ${item.refunded
                    ? '<span class="refund-badge">환불됨</span>'
                    : `<span class="refund-badge">환불</span>
                       <button class="refund-btn" onclick="submitRefund(${item.id}, ${item.amount})">환불</button>`
                }
            </div>`
        ).join('');
    }

    async function submitRefund(purchaseId, amount) {
        if (!currentPurchaseUserId) return;
        try {
            const res = await fetch('/api/refund', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    userId: currentPurchaseUserId,
                    amount: amount,
                    purchaseId: purchaseId
                })
            });
            if (!res.ok) throw new Error();

            await fetchHistory();
            fetchAndRender();
            resetTimer();
        } catch (e) {
            const msgEl = document.getElementById('purchase-msg');
            msgEl.className = 'action-msg error';
            msgEl.textContent = '환불에 실패했습니다.';
        }
    }

    document.getElementById('purchase-amount').addEventListener('keydown', e => {
        if (e.key === 'Enter') submitPurchase();
    });

    /* ── 이벤트 결과 ── */
    let resultChart = null;

    async function fetchResult() {
        const userId = document.getElementById('result-user-input').value.trim();
        const labelEl = document.getElementById('result-user-label');
        const bodyEl = document.getElementById('result-body');

        if (!userId) {
            labelEl.className = 'result-user-label error';
            labelEl.textContent = '유저 ID를 입력해주세요.';
            return;
        }

        try {
            const res = await fetch(`/api/event/result?userId=${userId}`);
            if (!res.ok) throw new Error();
            const data = await res.json();

            labelEl.className = 'result-user-label';

            if (!data || data.length === 0) {
                labelEl.textContent = `유저 ${userId} — 이벤트 기간 내 구매 이력이 없습니다.`;
                bodyEl.innerHTML = '<span class="result-placeholder">구매 이력이 없습니다.</span>';
                if (resultChart) { resultChart.destroy(); resultChart = null; }
                return;
            }

            labelEl.textContent = `유저 ${userId} — 총 ${data.length}건`;

            const labels = data.map(e => formatTime(e.updatedAt));
            const scores = data.map(e => e.score);

            bodyEl.innerHTML = '<div class="chart-wrap"><canvas id="result-chart"></canvas></div>';

            if (resultChart) resultChart.destroy();

            resultChart = new Chart(document.getElementById('result-chart'), {
                type: 'line',
                data: {
                    labels,
                    datasets: [{
                        label: '누적 구매액',
                        data: scores,
                        borderColor: '#333',
                        backgroundColor: 'rgba(51,51,51,0.06)',
                        pointBackgroundColor: data.map(e => e.diff >= 0 ? '#333' : '#e05'),
                        pointRadius: 5,
                        pointHoverRadius: 7,
                        tension: 0.3,
                        fill: true,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                title: (items) => `시각: ${items[0].label}`,
                                label: (item) => `누적: ${Number(item.raw).toLocaleString('ko-KR')}원`,
                                afterLabel: (item) => {
                                    const entry = data[item.dataIndex];
                                    const sign = entry.diff >= 0 ? '+' : '';
                                    const rankStr = entry.rank != null ? `${entry.rank}위` : '-';
                                    return [`${sign}${Number(entry.diff).toLocaleString('ko-KR')}원`, `등수: ${rankStr}`];
                                },
                            }
                        }
                    },
                    scales: {
                        x: {
                            ticks: { font: { size: 11 }, maxRotation: 40, minRotation: 40 },
                            grid: { color: '#f0f0f0' }
                        },
                        y: {
                            ticks: {
                                font: { size: 11 },
                                callback: v => Number(v).toLocaleString('ko-KR') + '원'
                            },
                            grid: { color: '#f0f0f0' }
                        }
                    }
                }
            });
        } catch (e) {
            labelEl.className = 'result-user-label error';
            labelEl.textContent = '조회에 실패했습니다.';
        }
    }

    document.getElementById('result-user-input').addEventListener('keydown', e => {
        if (e.key === 'Enter') fetchResult();
    });

    /* ── 초기화 ── */
    fetchAndRender();
    resetTimer();
</script>
</body>
</html>
